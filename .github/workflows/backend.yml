name: Backend

on:
  push:
    branches: [main, master]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests unitaires et d'intégration (Testcontainers)
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: donni-api.jar
          path: backend/target/donni-api-*.jar
          if-no-files-found: error

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t donni-api:ci backend
