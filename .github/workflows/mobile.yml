name: Mobile

on:
  push:
    branches: [main, master]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
        continue-on-error: true
      - run: npm test -- --ci

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      DONNI_KEYSTORE_PASSWORD: ${{ secrets.DONNI_KEYSTORE_PASSWORD }}
      DONNI_KEY_ALIAS: ${{ secrets.DONNI_KEY_ALIAS }}
      DONNI_KEY_PASSWORD: ${{ secrets.DONNI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund

      - name: Fichier Firebase (facultatif)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Keystore de publication (facultatif)
        env:
          KEYSTORE_BASE64: ${{ secrets.DONNI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/donni-release.keystore"
            echo "DONNI_KEYSTORE_PATH=$RUNNER_TEMP/donni-release.keystore" >> "$GITHUB_ENV"
          else
            echo "Aucun keystore fourni : l'APK de publication sera signé avec la clé de débogage."
          fi

      - name: Compilation
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease -PdonniVersionCode=${{ github.run_number }}

      - name: Rassembler les livrables
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/DONNI-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/DONNI-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../dist/DONNI-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: DONNI-debug.apk
          path: dist/DONNI-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DONNI-release.apk
          path: dist/DONNI-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DONNI-release.aab
          path: dist/DONNI-release.aab
