server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  tomcat:
    threads:
      max: 40

spring:
  application:
    name: donni-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/donni}
    username: ${DATABASE_USER:donni}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

donni:
  timezone: ${APP_TIMEZONE:Africa/Douala}
  dispatch-token: ${DISPATCH_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:}
    refresh-pepper: ${JWT_REFRESH_PEPPER:}
    access-ttl: 15m
    refresh-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  fcm:
    project-id: ${FCM_PROJECT_ID:}
    client-email: ${FCM_CLIENT_EMAIL:}
    private-key: ${FCM_PRIVATE_KEY:}
  whatsapp:
    mode: ${WHATSAPP_MODE:disabled}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
