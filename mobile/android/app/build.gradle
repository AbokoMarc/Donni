apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def releaseKeystorePath = System.getenv("DONNI_KEYSTORE_PATH")
def releaseSigningAvailable = releaseKeystorePath != null && file(releaseKeystorePath).exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.donni"
    defaultConfig {
        applicationId "com.donni"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt((findProperty("donniVersionCode") ?: "1").toString())
        versionName = (findProperty("donniVersionName") ?: "1.0.0").toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("DONNI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DONNI_KEY_ALIAS")
                keyPassword System.getenv("DONNI_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sans variables d'environnement, l'APK release est signé avec la clé debug (test uniquement).
            signingConfig releaseSigningAvailable ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
